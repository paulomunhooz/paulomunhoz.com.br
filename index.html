<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paulo Munhoz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f0f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
    min-height: 100vh;
  }

  .site {
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 48px;
  }

  /* ── HERO ── */
  .hero {
    padding: 52px 28px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: #1e1e1e;
    border: 2px solid #2a2a2a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  .avatar svg {
    width: 40px;
    height: 40px;
    stroke: #444;
    fill: none;
  }

  .name {
    font-size: 24px;
    font-weight: 500;
    color: #fff;
    text-align: center;
    letter-spacing: -0.01em;
  }

  .tagline {
    font-size: 11px;
    color: #555;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  /* ── SECTION LABEL ── */
  .sec-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 28px 16px;
  }

  .sec-label svg {
    width: 14px;
    height: 14px;
    stroke: #555;
    fill: none;
    flex-shrink: 0;
  }

  .sec-label span {
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  /* ── PHOTO GRID ── */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin: 0 28px 20px;
    border-radius: 14px;
    overflow: hidden;
  }

  .photo-slot {
    aspect-ratio: 1;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }

  .photo-slot:hover { background: #222; }

  .photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo-slot svg {
    width: 24px;
    height: 24px;
    stroke: #2e2e2e;
    fill: none;
  }

  /* ── BUTTONS ── */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: calc(100% - 56px);
    margin: 0 28px 10px;
    padding: 15px 20px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    text-decoration: none;
    letter-spacing: 0.01em;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.98); }

  .btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .btn-wa {
    background: #0d2b1a;
    color: #22c55e;
    border: 0.5px solid #14532d;
  }

  .btn-site {
    background: #0d1f2b;
    color: #60a5fa;
    border: 0.5px solid #1e3a5f;
  }

  .btn-insta {
    background: #2b0d1f;
    color: #f472b6;
    border: 0.5px solid #5f1e3a;
  }

  .btn-yt {
    background: #2b0d0d;
    color: #f87171;
    border: 0.5px solid #5f1e1e;
  }

  .btn-tt {
    background: #0d0d2b;
    color: #a78bfa;
    border: 0.5px solid #1e1e5f;
  }

  /* ── DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 28px 28px;
  }

  .div-line {
    flex: 1;
    height: 0.5px;
    background: #222;
  }

  .div-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #2a2a2a;
    flex-shrink: 0;
  }

  /* ── IMÓVEIS HEADER ── */
  .imoveis-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 28px 20px;
  }

  .imoveis-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #1e1e1e;
    border: 1.5px solid #2a2a2a;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .imoveis-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  .imoveis-avatar svg {
    width: 24px;
    height: 24px;
    stroke: #444;
    fill: none;
  }

  .imoveis-info { display: flex; flex-direction: column; gap: 4px; }

  .imoveis-name {
    font-size: 15px;
    font-weight: 500;
    color: #fff;
  }

  .imoveis-sub {
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ── FOOTER ── */
  .footer {
    padding: 32px 28px 8px;
    text-align: center;
  }

  .footer span {
    font-size: 10px;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
</style>
</head>
